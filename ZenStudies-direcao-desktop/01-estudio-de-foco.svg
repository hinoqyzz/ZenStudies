  <text x="368" y="362" fill="#73D8B2" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="750" letter-spacing="1.6">FOCO ATUAL</text>
  <text x="368" y="423" fill="#F5F6F0" font-family="Manrope,Segoe UI,Arial" font-size="35" font-weight="720">Biologia celular</text>
  <text x="368" y="459" fill="#B9C5C1" font-family="Inter,Segoe UI,Arial" font-size="16">Mitocôndrias e produção de energia · 12 min</text>
  <rect x="368" y="498" width="182" height="50" rx="15" fill="#6558E8"/>
  <text x="459" y="530" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700">Continuar sessão</text>
  <text x="573" y="530" fill="#B9C5C1" font-family="Inter,Segoe UI,Arial" font-size="14">Enter</text>
  <g transform="translate(890 352)">
    <rect x="0" y="0" width="118" height="118" rx="38" fill="none" stroke="#F5F6F0" stroke-width="18"/>
    <rect x="54" y="54" width="118" height="118" rx="38" fill="none" stroke="#6558E8" stroke-width="18"/>
    <rect x="51" y="51" width="70" height="70" rx="22" fill="#73D8B2" stroke="#101C1A" stroke-width="10"/>
  </g>

  <text x="332" y="650" fill="#101C1A" font-family="Manrope,Segoe UI,Arial" font-size="25" font-weight="720">Depois do foco</text>
  <rect x="332" y="680" width="385" height="128" rx="20" fill="#FFFFFF" stroke="#D4DDD8"/>
  <rect x="354" y="702" width="56" height="56" rx="16" fill="#E8E5FF"/><rect x="372" y="720" width="20" height="20" rx="6" fill="#6558E8"/>
  <text x="430" y="724" fill="#101C1A" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700">História moderna</text>
  <text x="430" y="752" fill="#52625E" font-family="Inter,Segoe UI,Arial" font-size="14">5 revisões · aproximadamente 7 min</text>
  <rect x="430" y="772" width="190" height="6" rx="3" fill="#E4E9E6"/><rect x="430" y="772" width="92" height="6" rx="3" fill="#6558E8"/>
  <rect x="741" y="680" width="385" height="128" rx="20" fill="#FFFFFF" stroke="#D4DDD8"/>
  <rect x="763" y="702" width="56" height="56" rx="16" fill="#DDF5EB"/><path d="M778 730h26" stroke="#187A58" stroke-width="5" stroke-linecap="round"/>
  <text x="839" y="724" fill="#101C1A" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700">Nota rápida</text>
  <text x="839" y="752" fill="#52625E" font-family="Inter,Segoe UI,Arial" font-size="14">Capture uma ideia sem sair do fluxo</text>
  <text x="839" y="781" fill="#6558E8" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700">Ctrl + Shift + N</text>

  <rect x="1170" y="158" width="390" height="812" fill="#EDF1EE"/>
  <text x="1210" y="218" fill="#101C1A" font-family="Manrope,Segoe UI,Arial" font-size="24" font-weight="720">Revisões de hoje</text>
  <text x="1210" y="249" fill="#52625E" font-family="Inter,Segoe UI,Arial" font-size="14">8 cartões em duas matérias</text>
  <rect x="1210" y="282" width="310" height="94" rx="18" fill="#FFFFFF"/>
  <circle cx="1244" cy="329" r="18" fill="#E8E5FF"/><circle cx="1244" cy="329" r="7" fill="#6558E8"/>
  <text x="1276" y="321" fill="#101C1A" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700">Biologia celular</text><text x="1276" y="347" fill="#52625E" font-family="Inter,Segoe UI,Arial" font-size="13">3 cartões</text>
  <rect x="1210" y="390" width="310" height="94" rx="18" fill="#FFFFFF"/>
  <circle cx="1244" cy="437" r="18" fill="#DDF5EB"/><path d="M1235 437h18" stroke="#187A58" stroke-width="4" stroke-linecap="round"/>
  <text x="1276" y="429" fill="#101C1A" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700">História moderna</text><text x="1276" y="455" fill="#52625E" font-family="Inter,Segoe UI,Arial" font-size="13">5 cartões</text>
  <rect x="1210" y="510" width="310" height="46" rx="14" fill="#6558E8"/><text x="1365" y="539" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700">Iniciar revisão</text>
  <line x1="1210" y1="601" x2="1520" y2="601" stroke="#D4DDD8"/>
  <text x="1210" y="648" fill="#101C1A" font-family="Manrope,Segoe UI,Arial" font-size="20" font-weight="700">Atalhos</text>
  <text x="1210" y="690" fill="#52625E" font-family="Inter,Segoe UI,Arial" font-size="14">Nova nota</text><text x="1510" y="690" text-anchor="end" fill="#101C1A" font-family="Inter,Segoe UI,Arial" font-size="13">Ctrl N</text>
  <text x="1210" y="730" fill="#52625E" font-family="Inter,Segoe UI,Arial" font-size="14">Buscar tudo</text><text x="1510" y="730" text-anchor="end" fill="#101C1A" font-family="Inter,Segoe UI,Arial" font-size="13">Ctrl K</text>
  <text x="1210" y="770" fill="#52625E" font-family="Inter,Segoe UI,Arial" font-size="14">Abrir revisão</text><text x="1510" y="770" text-anchor="end" fill="#101C1A" font-family="Inter,Segoe UI,Arial" font-size="13">Ctrl R</text>
</svg>
