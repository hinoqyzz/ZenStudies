  <text x="332" y="222" fill="#52625E" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700" letter-spacing="1.5">SEGUNDA · 12 DE OUTUBRO</text>
  <text x="332" y="278" fill="#101C1A" font-family="Manrope,Segoe UI,Arial" font-size="42" font-weight="750" letter-spacing="-1.2">Continue de onde parou</text>
