<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ZenStudies desktop — Estúdio de Foco</title>
  <desc id="desc">Tela inicial desktop com navegação lateral, foco do dia e fila contextual.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#101C1A" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#DDE5E0"/>
  <g filter="url(#shadow)">
    <rect x="40" y="30" width="1520" height="940" rx="30" fill="#F5F6F0"/>
  </g>
  <rect x="40" y="30" width="1520" height="54" rx="30" fill="#FFFFFF"/>
  <rect x="40" y="58" width="1520" height="26" fill="#FFFFFF"/>
  <circle cx="72" cy="57" r="7" fill="#D8DEDA"/><circle cx="96" cy="57" r="7" fill="#D8DEDA"/><circle cx="120" cy="57" r="7" fill="#D8DEDA"/>
  <text x="800" y="64" text-anchor="middle" fill="#52625E" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="600">ZenStudies</text>

  <rect x="40" y="84" width="248" height="886" fill="#101C1A"/>
  <g transform="translate(70 114)">
    <rect x="0" y="0" width="36" height="36" rx="12" fill="none" stroke="#F5F6F0" stroke-width="7"/>
    <rect x="17" y="17" width="36" height="36" rx="12" fill="none" stroke="#8176F2" stroke-width="7"/>
    <rect x="16" y="16" width="21" height="21" rx="7" fill="#73D8B2" stroke="#101C1A" stroke-width="4"/>
    <text x="72" y="35" fill="#F5F6F0" font-family="Manrope,Segoe UI,Arial" font-size="24" font-weight="750">ZenStudies</text>
  </g>
  <g font-family="Inter,Segoe UI,Arial" font-size="17">
    <rect x="62" y="206" width="204" height="50" rx="14" fill="#F5F6F0" opacity=".12"/>
    <circle cx="88" cy="231" r="7" fill="#73D8B2"/><text x="112" y="237" fill="#FFFFFF" font-weight="650">Hoje</text>
    <text x="80" y="305" fill="#B9C5C1">Notas</text><text x="80" y="359" fill="#B9C5C1">Revisões</text><text x="80" y="413" fill="#B9C5C1">Biblioteca</text>
    <line x1="68" y1="450" x2="260" y2="450" stroke="#34433F"/>
    <text x="80" y="497" fill="#7F918B" font-size="13" font-weight="700" letter-spacing="1.5">MATÉRIAS</text>
    <circle cx="84" cy="535" r="5" fill="#6558E8"/><text x="102" y="541" fill="#B9C5C1">Biologia</text>
    <circle cx="84" cy="579" r="5" fill="#73D8B2"/><text x="102" y="585" fill="#B9C5C1">Matemática</text>
    <circle cx="84" cy="623" r="5" fill="#E0B56D"/><text x="102" y="629" fill="#B9C5C1">História</text>
  </g>
  <rect x="66" y="890" width="196" height="48" rx="14" fill="#172825"/>
  <circle cx="91" cy="914" r="14" fill="#73D8B2"/><text x="116" y="920" fill="#DDE5E0" font-family="Inter,Segoe UI,Arial" font-size="15">Perfil pessoal</text>

  <rect x="288" y="84" width="1272" height="74" fill="#F5F6F0"/>
  <text x="332" y="130" fill="#101C1A" font-family="Manrope,Segoe UI,Arial" font-size="22" font-weight="700">Hoje</text>
  <rect x="700" y="102" width="340" height="40" rx="12" fill="#FFFFFF" stroke="#D4DDD8"/>
  <text x="724" y="128" fill="#899792" font-family="Inter,Segoe UI,Arial" font-size="14">Buscar notas, matérias ou comandos</text>
